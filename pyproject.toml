[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibrt-cce"
version = "0.0.1"
description = "IBRT_CCE - Ibert Computational Civil Engineering: parametric open-source FEM platform for civil engineers"
readme = "README.md"
requires-python = ">=3.11"
# License intentionally not declared yet - decision (MIT vs. GPLv3) pending
# before first release, see docs/Projektziele_FEM_Software.md.
authors = [{ name = "IBRT_CCE contributors" }]
dependencies = [
    # Frame/truss kernel. Adapter verified against Pynite 3.0.0 (see tests/benchmarks).
    "PyNiteFEA>=3.0,<4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
